version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
    # A field may go once its number and name are reserved, so old clients never collide.
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
  # These two contracts were deliberately retired in favor of the Tilde provider.
  # Keep compatibility checks for every active contract.
  ignore:
    - proto/tilde/management/v1/chat.proto
    - proto/tilde/ingress/v1/chat.proto
    # The sidecar's memory relay was renamed KnowledgeService (memory and wiki tools) before any
    # release shipped it.
    - proto/tilde/runtime/v1/memory.proto
  # AgentService (Invoke/Healthz) was deliberately retired: hosts only dial in through
  # RunService.Watch. InvokeRequest stays in that file and stays checked.
  # GetLogsStatus and GetTracingStatus were deliberately retired: ClickHouse is required, so
  # there is no storage state to report.
  ignore_only:
    FIELD_SAME_TYPE:
      # ApplyService had shipped in no release when SignalTriggerSpec.filters moved from
      # SignalFilter to its own SignalFilterSpec (same fields, numbers and JSON), so apply.proto
      # ports to open-source Tilde byte-identical. Drop this once Apply has been released.
      - proto/tilde/management/v1/apply.proto
    MESSAGE_NO_DELETE:
      - proto/tilde/agent_host/v1/agent.proto
      - proto/tilde/management/v1/logs.proto
      - proto/tilde/management/v1/tracing.proto
    ENUM_NO_DELETE:
      - proto/tilde/management/v1/logs.proto
      - proto/tilde/management/v1/tracing.proto
    RPC_NO_DELETE:
      - proto/tilde/management/v1/logs.proto
      - proto/tilde/management/v1/tracing.proto
    SERVICE_NO_DELETE:
      - proto/tilde/agent_host/v1/agent.proto
