changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: "### {{.Kind}}"
changeFormat: "{{if .Body}}* {{.Body}}{{end}}"
kinds:
  - label: Added
    auto: major
  - label: Changed
    auto: major
  - label: Removed
    auto: major
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
envPrefix: CHANGIE_

replacements:
  - path: VERSION
    find: "^.+$"
    replace: "{{.VersionNoPrefix}}"
  # All Rust crates inherit workspace.package.version, including the binary.
  - path: Cargo.toml
    find: '^version = ".*"$'
    replace: 'version = "{{.VersionNoPrefix}}"'
  # New SDK packages in this workspace join the same release automatically.
  - path: sdk/ts/packages/*/package.json
    find: '^  "version": ".*",$'
    replace: '  "version": "{{.VersionNoPrefix}}",'
