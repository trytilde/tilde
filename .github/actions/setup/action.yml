name: Build toolchain
description: Install the repository's Rust, JavaScript, Python, and Task toolchains
runs:
  using: composite
  steps:
    - uses: go-task/setup-task@v1
      with:
        version: 3.53.1
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.1
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          sdk/ts/pnpm-lock.yaml
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    # uv drives the Python SDK workspace in sdk/py.
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.12.13"
        enable-cache: true
        cache-dependency-glob: sdk/py/uv.lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
        components: rustfmt, clippy
    # Rust compiles through sccache with the team S3 cache when the job can assume the build cache
    # role (it needs `id-token: write`). Without it, for example on a fork's pull request, the job
    # builds without sccache. The server starts with the role's credentials and keeps them, so
    # later steps, tests included, never see AWS credentials.
    - uses: mozilla-actions/sccache-action@v0.0.9
    - id: build-cache
      uses: aws-actions/configure-aws-credentials@v4
      continue-on-error: true
      with:
        role-to-assume: arn:aws:iam::914788356809:role/github-build-cache
        aws-region: us-east-1
        output-credentials: true
        output-env-credentials: false
    - name: Start sccache on the S3 cache
      if: steps.build-cache.outcome == 'success'
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.build-cache.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.build-cache.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.build-cache.outputs.aws-session-token }}
        SCCACHE_BUCKET: tilde-sccache-prod
        SCCACHE_REGION: us-east-1
        SCCACHE_S3_KEY_PREFIX: ${{ github.event.repository.name }}/
        SCCACHE_IDLE_TIMEOUT: "0"
      run: |
        sccache --start-server
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    # The Cargo registry and installed tools (cornucopia); sccache covers compiled crates.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: tilde
        cache-targets: false
    # Pinned code generators that `pnpm tools` downloads.
    - uses: actions/cache@v4
      with:
        path: .tools
        key: codegen-${{ runner.os }}-${{ hashFiles('scripts/install-codegen.mjs') }}
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    # protoc: the vendored Rotel crate compiles its Datadog protos at build time.
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libsystemd-dev protobuf-compiler ripgrep
    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install protobuf
