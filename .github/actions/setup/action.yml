name: Build toolchain
description: Install the repository's Rust, JavaScript, Python, and Task toolchains
runs:
  using: composite
  steps:
    - uses: go-task/setup-task@v1
      with:
        version: 3.53.1
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.1
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          sdk/ts/pnpm-lock.yaml
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    # uv drives the Python SDK workspace in sdk/py.
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.12.13"
        enable-cache: true
        cache-dependency-glob: sdk/py/uv.lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
        components: rustfmt, clippy
    # Depot runners point sccache at Depot Cache (SCCACHE_WEBDAV_ENDPOINT and a per-job token), so
    # Rust compiles through it there. On any other runner the job builds without sccache.
    - uses: mozilla-actions/sccache-action@v0.0.9
    - name: Compile Rust through sccache on Depot Cache
      shell: bash
      run: |
        if [ -n "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        else
          echo "No Depot Cache on this runner; building without sccache."
        fi
    # The Cargo registry and installed tools (cornucopia); sccache covers compiled crates. On Depot
    # runners this and every other GitHub Actions cache below is stored in Depot Cache.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: tilde
        cache-targets: false
    # Pinned code generators that `pnpm tools` downloads.
    - uses: actions/cache@v4
      with:
        path: .tools
        key: codegen-${{ runner.os }}-${{ hashFiles('scripts/install-codegen.mjs') }}
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    # protoc: the vendored Rotel crate compiles its Datadog protos at build time.
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libsystemd-dev protobuf-compiler ripgrep
    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install protobuf
