name: Check
# Runs on pull requests labelled "run ci", and when a release calls it. Other pull requests and
# pushes to main run nothing, to save Actions time; a newer push to a PR cancels the older run.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_call:
concurrency:
  group: ci-${{ (github.event.action == 'labeled' && github.event.label.name != 'run ci') && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    # Pull requests run only with the "run ci" label (adding it starts a run); releases call this
    # workflow directly and always run it.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run ci'))
    # Fork pull requests run on GitHub's runners: Depot runners cost money and carry a Depot Cache
    # token that could write poisoned compiler output.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'depot-ubuntu-24.04-8' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task test:deployment-action
      - run: task version:check
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir sdk/ts install --frozen-lockfile
      - run: pnpm tools
      - run: pnpm exec buf lint
      - run: pnpm generate:check
      - name: Check contract compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec buf breaking --against ".git#branch=origin/$BASE_REF"
      - run: task check:web
      - run: task build:connection-ui
      - run: pnpm --dir web build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo install cornucopia --version 1.0.1 --locked
      - run: task queries:generate -- --check
      - run: task check:queries
      - run: scripts/with-postgres.sh task test:run
