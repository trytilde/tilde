name: Check
# Runs on pull requests that are ready for review, and when a release calls it. Draft PRs and
# pushes to main run nothing, to save Actions time; a newer push to a PR cancels the older run.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # id-token: the build cache role for sccache (see .github/actions/setup).
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task test:deployment-action
      - run: task version:check
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir sdk/ts install --frozen-lockfile
      - run: pnpm tools
      - run: pnpm exec buf lint
      - run: pnpm generate:check
      - name: Check contract compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec buf breaking --against ".git#branch=origin/$BASE_REF"
      - run: task check:web
      - run: task build:connection-ui
      - run: pnpm --dir web build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo install cornucopia --version 1.0.1 --locked
      - run: task queries:generate -- --check
      - run: task check:queries
      - run: scripts/with-postgres.sh task test:run
