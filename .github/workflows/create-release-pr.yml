name: Create Release PR
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment (auto follows the configured major-bump policy)
        type: choice
        options: [patch, minor, major, auto]
        default: patch
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-pr
  cancel-in-progress: false
jobs:
  changelog:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A bot token lets the resulting PR trigger ordinary PR checks.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_BOT_TOKEN }}
      - uses: ./.github/actions/setup
      - uses: miniscruff/changie-action@v3
        with:
          version: v1.24.0
      - name: Prepare versions and lockfiles
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          pnpm --dir sdk/ts install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
          task release:prepare -- "$RELEASE_BUMP"
          python3 scripts/release-acknowledgement.py
      - name: Read release version
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GIT_BOT_TOKEN }}
          branch: codex/release
          title: Release ${{ steps.version.outputs.tag }}
          commit-message: Release ${{ steps.version.outputs.tag }}
          body: |
            Prepare the shared Rust and SDK release version and changelog.

            Validated manifest versions and refreshed Cargo/pnpm lockfiles.
            After CI passes and this PR is merged, run the Release workflow on the default branch.
          add-paths: |
            .changes/
            CHANGELOG.md
            VERSION
            Cargo.toml
            Cargo.lock
            sdk/ts/packages/*/package.json
            sdk/ts/pnpm-lock.yaml
