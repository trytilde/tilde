name: Build
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  binary:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task version:check build
      - name: Archive and smoke-test binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: task release:archive
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
      - name: Pack SDK packages
        if: runner.os == 'Linux'
        run: task sdk:pack
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sdk-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tilde:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container version
        run: test "$(docker run --rm tilde:ci --version)" = "tilde $(cat VERSION)"
