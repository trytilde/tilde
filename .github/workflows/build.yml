name: Build
# Runs on pull requests that are ready for review, and when a release calls it. Draft PRs and
# pushes to main run nothing, to save Actions time; a newer push to a PR cancels the older run.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Releases publish exactly these packages, so a failed pack fails the PR, not the release.
  sdk:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir sdk/ts install --frozen-lockfile
      - run: task sdk:pack sdk:py:pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/py/*
          if-no-files-found: error
  container:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tilde:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container version
        run: test "$(docker run --rm tilde:ci --version)" = "tilde $(cat VERSION)"
