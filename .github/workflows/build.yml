name: Build
# Pull requests cover branches; push runs only for main so a PR push does not run twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  # Releases publish exactly these packages, so a failed pack fails the PR, not the release.
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir sdk/ts install --frozen-lockfile
      - run: task sdk:pack sdk:py:pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/py/*
          if-no-files-found: error
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tilde:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container version
        run: test "$(docker run --rm tilde:ci --version)" = "tilde $(cat VERSION)"
