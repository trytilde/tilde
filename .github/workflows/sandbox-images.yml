name: Sandbox images
# Public Debian images to try Tilde sandboxes with: ghcr.io/trytilde/sandbox-debian-{node,python,full}
# (images/sandbox/Dockerfile). Versioned with the rest of the repository by Changie: they install the
# CLI of the release in VERSION and are tagged with it. Release calls this once the release exists,
# since the images download the CLI from it; dispatch republishes the current version.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [node, python, full]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve version and image
        env:
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(cat VERSION)"
          grep -qx "ARG TILDE_VERSION=$version" images/sandbox/Dockerfile
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MINOR=${version%.*}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER,,}/sandbox-debian-$TARGET" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: images/sandbox
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=sandbox-debian-${{ matrix.target }}
            org.opencontainers.image.description=Debian sandbox image for Tilde (${{ matrix.target }}) with the Tilde CLI
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=sandbox-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.target }}
      - name: Smoke-test pushed image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          run() { docker run --rm --privileged "$IMAGE:$VERSION" bash -ec "$1"; }
          test "$(docker run --rm "$IMAGE:$VERSION" tilde --version)" = "tilde $VERSION"
          run 'tilde sandbox credential --help >/dev/null; test "$(id -u)" = 0; gh --version; jq --version; rg --version; fd --version'
          case "$TARGET" in
            node) run 'node --version; npm --version; pnpm --version' ;;
            python) run 'python --version; uv --version; pip --version' ;;
            full) run 'node --version; python --version; uv --version; docker compose version; docker run --rm hello-world' ;;
          esac
