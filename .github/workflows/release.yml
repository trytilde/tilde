name: Release
# Merging a Create Release PR changes VERSION on the default branch and releases it.
# Dispatch reruns a release for the same commit.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: miniscruff/changie-action@v3
        with:
          version: v1.24.0
      - id: version
        run: scripts/check-release.sh
  changie:
    needs: version
    uses: ./.github/workflows/changie.yml
  check:
    needs: version
    uses: ./.github/workflows/ci.yml
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  draft:
    needs: [version, changie, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tilde-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: dist/npm
      - name: Create tag and draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Release is already published"' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file ".changes/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/release/* dist/npm/*.tgz --clobber
  npm:
    needs: [version, draft]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm --dir sdk/ts install --frozen-lockfile --ignore-scripts
      - name: Publish all public SDK packages (already-published versions are skipped)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: task sdk:publish
  container:
    needs: [version, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/trytilde/tilde
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:${VERSION%.*}"
            echo "$IMAGE:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=Tilde
            org.opencontainers.image.description=Open-source Tilde agent registry and runtime harness
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test published image
        run: test "$(docker run --rm "$IMAGE:$VERSION" --version)" = "tilde $VERSION"
  publish-release:
    needs: [version, npm, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish completed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
