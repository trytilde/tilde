name: Release
# Merging a Create Release PR changes VERSION on the default branch and releases it.
# Dispatch reruns a release for the same commit.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: miniscruff/changie-action@v3
        with:
          version: v1.24.0
      - id: version
        run: scripts/check-release.sh
  changie:
    needs: version
    uses: ./.github/workflows/changie.yml
  check:
    needs: version
    uses: ./.github/workflows/ci.yml
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  # Public image on GHCR. A rerun leaves an already-pushed version alone.
  container:
    needs: [version, changie, check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Skip a version that is already pushed
        id: existing
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve the major.minor tag
        id: minor
        run: echo "tag=${VERSION%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.pushed != 'true'
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.pushed != 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ steps.minor.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=Tilde
            org.opencontainers.image.description=Open-source Tilde agent registry and runtime harness
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test pushed image
        run: test "$(docker run --rm "$IMAGE:$VERSION" --version)" = "tilde $VERSION"
  # Publishes the tarballs Build packed and tested. npm refuses an existing version, so a
  # rerun skips packages that already published.
  npm:
    needs: [version, changie, check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
      - name: Publish unpublished SDK packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in dist/npm/*.tgz; do
            spec="$(tar -xOzf "$tarball" package/package.json | jq -r '.name + "@" + .version')"
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish "$tarball" --access public --tag latest
            fi
          done
  # PyPI trusted publishing: each project trusts this repository's release.yml in its own
  # environment, pypi-<project>. PyPI allows one pending publisher per owner, repository,
  # workflow and environment, so the environment is what tells the six projects apart. No
  # token is stored. Attestations need a public repository; enable them once it is public.
  pypi:
    needs: [version, changie, check, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - trytilde
          - trytilde-langchain
          - trytilde-pydantic-ai
          - trytilde-openai-agents
          - trytilde-agno
          - trytilde-crewai
    environment: pypi-${{ matrix.project }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/all
      # Wheels and sdists name the project with underscores (trytilde_langchain-3.0.0...).
      - name: Select this project's distributions
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p dist/py
          mv dist/all/"${PROJECT//-/_}"-[0-9]* dist/py/
          ls dist/py
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/py
          skip-existing: true
          attestations: false
  # The tag and release are created last, once the image and every package are published.
  release:
    needs: [version, container, npm, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-packages"
          path: dist/packages
          merge-multiple: true
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file ".changes/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" dist/packages/* --clobber
