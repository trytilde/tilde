[project]
name = "trytilde-langchain"
version = "3.0.0"
description = "Tilde adapter for LangChain and LangGraph: typed context to LangChain messages and channel tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["trytilde", "langchain-core>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilde_langchain"]

[tool.hatch.build.targets.sdist]
include = ["src/tilde_langchain", "README.md"]
