[project]
name = "trytilde-crewai"
version = "3.1.1"
description = "Tilde adapter for CrewAI: convert invocation history to CrewAI messages and channel tools to CrewAI tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["trytilde", "crewai>=1.15,<2", "pyyaml>=6"]

# `tilde deploy` reads @CrewBase YAML prompts and skills through this discoverer.
[project.entry-points."tilde.discover"]
crewai = "tilde_crewai.discover:discover"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilde_crewai"]

[tool.hatch.build.targets.sdist]
include = ["src/tilde_crewai", "README.md"]
