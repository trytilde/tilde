[project]
name = "trytilde-agno"
version = "3.1.0"
description = "Tilde adapter for Agno: convert invocation history to Agno messages and channel tools to Agno functions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["trytilde", "agno>=3,<4"]

# `tilde deploy` reads module-level agents' prompts (and skill folders) through this discoverer.
[project.entry-points."tilde.discover"]
agno = "tilde_agno.discover:discover"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilde_agno"]

[tool.hatch.build.targets.sdist]
include = ["src/tilde_agno", "README.md"]
