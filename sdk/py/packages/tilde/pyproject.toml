[project]
name = "trytilde"
version = "3.0.1"
description = "Tilde agent SDK for Python: dial-in agent hosts, invocation context, channel tools, FastAPI integration and the chat proxy"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "connectrpc>=0.12,<1",
  "protobuf>=5.29",
  "pydantic>=2.7",
  "pyqwest>=0.5",
  # Provider SDKs (OpenAI, LiteLLM) take an httpx client; ctx.inference supplies one.
  "httpx>=0.27",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-common>=1.30",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling", "grpcio-tools>=1.84", "protoc-gen-connectrpc>=0.12"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tilde"]

[tool.hatch.build.targets.sdist]
include = ["src/tilde", "README.md"]
