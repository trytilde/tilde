# Development stand-in for the published `trytilde-cli`.
#
# The wheels on PyPI carry a prebuilt `tilde` binary in their `.data/scripts` directory and are
# written by `scripts/pack-cli.py`, not by this project: a release has one wheel per platform and
# no sdist, because there is nothing to build from source without a Rust toolchain. This package
# exists so that `uv lock` and `uv sync` can resolve `trytilde-cli` inside this repository (see
# [tool.uv.sources] in sdk/py/pyproject.toml) and so `uv run tilde` uses the binary you built
# with cargo. `task sdk:py:pack` skips it deliberately.
[project]
name = "trytilde-cli"
version = "3.1.0"
description = "The Tilde CLI: develop, deploy and inspect Tilde agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tilde = "trytilde_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trytilde_cli"]
