[project]
name = "trytilde-pydantic-ai"
version = "3.1.0"
description = "Tilde adapter for Pydantic AI: typed context to model messages, channel tools to Pydantic AI tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["trytilde", "pydantic-ai-slim>=2,<3"]

# `tilde deploy` reads module-level agents' prompts (and skill folders) through this discoverer.
[project.entry-points."tilde.discover"]
pydantic-ai = "tilde_pydantic_ai.discover:discover"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilde_pydantic_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/tilde_pydantic_ai", "README.md"]
