[workspace]
members = [
  "crates/tilde",
  "crates/client-aws-config",
  "crates/client-aws-sigv4",
  "crates/client-aws-kms",
]
exclude = ["vendor/rotel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true

[workspace.dependencies]
client-aws-config = { path = "crates/client-aws-config" }
client-aws-sigv4 = { path = "crates/client-aws-sigv4" }
client-aws-kms = { path = "crates/client-aws-kms" }
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
zeroize = { version = "1", features = ["derive"] }
