# Database queries are generated by Cornucopia and checked into crates/queries.

# Linking: Rust links x86_64 Linux with its bundled rust-lld by default (~2 s for the debug
# tilde binary; GNU ld takes ~15 s), so do not point `linker` at plain `cc`. mold is slightly
# faster still; it is not set here because Docker and CI do not ship it. To opt in locally,
# install mold and clang and add to ~/.cargo/config.toml:
#   [target.x86_64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=mold"]
