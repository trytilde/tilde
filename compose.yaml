services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    profiles: [dev]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ENGINE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ENGINE_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${ADDRESS:-127.0.0.1}:${MINIO_PORT:-19000}:9000"
      - "${ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    profiles: [dev]
    environment:
      ACCESS_KEY: ${ENGINE_S3_ACCESS_KEY_ID:-minioadmin}
      SECRET_KEY: ${ENGINE_S3_SECRET_ACCESS_KEY:-minioadmin}
      BUCKET: ${ENGINE_S3_BUCKET:-tilde-avatars}
      LOGS_BUCKET: ${ENGINE_LOGS_S3_BUCKET:-tilde-logs}
      TRACES_BUCKET: ${ENGINE_TRACES_S3_BUCKET:-tilde-traces}
      METRICS_BUCKET: ${ENGINE_METRICS_S3_BUCKET:-tilde-metrics}
      MEDIA_BUCKET: ${ENGINE_MEDIA_S3_BUCKET:-tilde-media}
      SKILLS_BUCKET: ${ENGINE_SKILLS_S3_BUCKET:-tilde-skills}
      TEST_BUCKET: ${TEST_S3_BUCKET:-tilde-test}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mc alias set tilde http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY" >/dev/null; for bucket in "$$BUCKET" "$$LOGS_BUCKET" "$$TRACES_BUCKET" "$$METRICS_BUCKET" "$$MEDIA_BUCKET" "$$SKILLS_BUCKET" "$$TEST_BUCKET"; do mc mb --ignore-existing "tilde/$$bucket"; done; for bucket in "$$LOGS_BUCKET" "$$TRACES_BUCKET" "$$METRICS_BUCKET"; do mc ilm rule ls "tilde/$$bucket" >/dev/null 2>&1 || mc ilm rule add --expire-days 1 "tilde/$$bucket"; done'
    depends_on:
      minio:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: engine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U engine -d engine"]
      interval: 3s
      timeout: 3s
      retries: 20
  engine:
    build: .
    command: ["--listen", "0.0.0.0:8080", "--allow-network"]
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://engine:${POSTGRES_PASSWORD}@postgres:5432/engine
      ENGINE_CLICKHOUSE_URL: ${ENGINE_CLICKHOUSE_CONTAINER_URL:-${ENGINE_CLICKHOUSE_URL:-}}
      ENGINE_CLICKHOUSE_DATABASE: ${ENGINE_CLICKHOUSE_DATABASE:-tilde_telemetry}
      ENGINE_CLICKHOUSE_USER: ${ENGINE_CLICKHOUSE_USER:-default}
      ENGINE_CLICKHOUSE_PASSWORD: ${ENGINE_CLICKHOUSE_PASSWORD:-}
      LOGS_OTLP_ENDPOINT: ${LOGS_OTLP_ENDPOINT:-}
      LOGS_OTLP_HEADERS: ${LOGS_OTLP_HEADERS:-}
      ENGINE_LOGS_S3_BUCKET: ${ENGINE_LOGS_S3_BUCKET:-}
      ENGINE_TRACES_S3_BUCKET: ${ENGINE_TRACES_S3_BUCKET:-}
      ENGINE_METRICS_S3_BUCKET: ${ENGINE_METRICS_S3_BUCKET:-}
      ENGINE_MEDIA_S3_BUCKET: ${ENGINE_MEDIA_S3_BUCKET:-}
      ENGINE_CLICKHOUSE_RETENTION_DAYS: ${ENGINE_CLICKHOUSE_RETENTION_DAYS:-}
      METRICS_OTLP_ENDPOINT: ${METRICS_OTLP_ENDPOINT:-}
      METRICS_OTLP_HEADERS: ${METRICS_OTLP_HEADERS:-}
      TRACES_OTLP_ENDPOINT: ${TRACES_OTLP_ENDPOINT:-}
      TRACES_OTLP_HEADERS: ${TRACES_OTLP_HEADERS:-}
      ENGINE_ENCRYPTION_BACKEND: ${ENGINE_ENCRYPTION_BACKEND:-seed}
      ENGINE_ENCRYPTION_KEY: ${ENGINE_ENCRYPTION_KEY:-}
      ENGINE_KMS_KEY_ID: ${ENGINE_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ENGINE_S3_BUCKET: ${ENGINE_S3_BUCKET:-}
      ENGINE_S3_REGION: ${ENGINE_S3_REGION:-us-east-1}
      ENGINE_S3_ENDPOINT: ${ENGINE_S3_CONTAINER_ENDPOINT:-http://minio:9000}
      ENGINE_S3_PUBLIC_ENDPOINT: ${ENGINE_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:19000}
      ENGINE_S3_ACCESS_KEY_ID: ${ENGINE_S3_ACCESS_KEY_ID:-}
      ENGINE_S3_SECRET_ACCESS_KEY: ${ENGINE_S3_SECRET_ACCESS_KEY:-}
      ENGINE_SERVE: ${ENGINE_SERVE:-all}
      ENGINE_WEB_ENABLED: ${ENGINE_WEB_ENABLED:-true}
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://127.0.0.1:8080}
      ENGINE_INGRESS_PUBLIC_URL: ${ENGINE_INGRESS_PUBLIC_URL:-}
      ENGINE_RUNTIME_PUBLIC_URL: ${ENGINE_RUNTIME_PUBLIC_URL:-}
      ENGINE_WEB_ORIGINS: ${ENGINE_WEB_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
  # Local development only; override these defaults in .env.
  logs-clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    profiles: [logs]
    environment:
      CLICKHOUSE_DB: ${ENGINE_CLICKHOUSE_DATABASE:-tilde_telemetry}
      CLICKHOUSE_USER: ${ENGINE_CLICKHOUSE_USER:-tilde}
      CLICKHOUSE_PASSWORD: ${ENGINE_CLICKHOUSE_PASSWORD:-tilde-logs-dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:${ENGINE_CLICKHOUSE_PORT:-18123}:8123"]
    volumes: [logs-clickhouse:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8123/ping]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  logs-clickhouse:
  minio-data:
  postgres-data:
