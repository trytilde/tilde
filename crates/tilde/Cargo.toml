[package]
name = "tilde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Live services are opt-in; tests also stay ignored under --all-features.
live-chat-tests = []
embedded-web = ["dep:rust-embed", "dep:mime_guess"]

[package.metadata.cargo-machete]
# Feature-only dependencies make the AES key schedule and GHASH/POLYVAL state zeroize on drop.
ignored = ["aes", "ghash", "polyval"]

[dependencies]
rotel = { path = "../../vendor/rotel", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "trace", "with-serde"] }
prost = "0.14"
tokio-util = "0.7"
http-body = "1"
ed25519-dalek = "2"
jsonschema = { version = "0.52.0", default-features = false }
async-trait = "0.1"
reqwest.workspace = true
jsonwebtoken = "9"
futures = "0.3"
async-stream = "0.3"
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
webpki-roots = "0.26"

client-aws-kms.workspace = true
envconfig = "0.11.1"
aes = { version = "0.8.4", features = ["zeroize"] }
ghash = { version = "0.5.1", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
axum = "0.8"
base64 = "0.22"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
connectrpc = { version = "=0.9.0", default-features = false, features = [
  "axum",
  "json",
  "client",
  "client-tls",
] }
http = "1"
rand = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "macros",
  "json",
] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
rust-embed = { version = "8.12", optional = true, features = [
  "debug-embed",
  "deterministic-timestamps",
] }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
client-aws-config.workspace = true
client-aws-sigv4.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[test]]
name = "chat_providers_live"
required-features = ["live-chat-tests"]

[[test]]
name = "chat_providers_two_way"
required-features = ["live-chat-tests"]
