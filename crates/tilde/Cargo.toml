[package]
name = "tilde"
default-run = "tilde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
embedded-web = ["dep:rust-embed", "dep:mime_guess"]

[package.metadata.cargo-machete]
# Feature-only dependencies make the AES key schedule and GHASH/POLYVAL state zeroize on drop.
ignored = ["aes", "ghash", "polyval"]

[dependencies]
rotel = { path = "../../vendor/rotel", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "trace", "logs", "with-serde"] }
prost = "0.14"
tokio-util = "0.7"
http-body = "1"
ed25519-dalek = "2"
jsonschema = { version = "0.52.0", default-features = false }
async-trait = "0.1"
reqwest.workspace = true
jsonwebtoken = "9"
futures = "0.3"
async-stream = "0.3"
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
webpki-roots = "0.26"

client-aws-kms.workspace = true
client-aws-config.workspace = true
client-aws-sigv4.workspace = true
envconfig = "0.11.1"
aes = { version = "0.8.4", features = ["zeroize"] }
ghash = { version = "0.5.1", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
axum = "0.8"
base64 = "0.22"
buffa.workspace = true
buffa-types.workspace = true
tilde-contracts.workspace = true
chrono = { version = "0.4", features = ["serde"] }
croner = "4"
clap = { version = "4", features = ["derive", "env"] }
connectrpc.workspace = true
flate2 = "1"
http = "1"
rand = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deadpool-postgres.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tilde-queries = { path = "../queries", default-features = false, features = ["deadpool"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "process",
  "fs",
] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = { version = "1", features = ["derive"] }
rust-embed = { version = "8.12", optional = true, features = [
  "debug-embed",
  "deterministic-timestamps",
] }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", features = ["trace", "testing"] }
client-aws-config.workspace = true
client-aws-sigv4.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
