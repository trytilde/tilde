<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tilde dev</title>
<style>
  :root {
    color-scheme: light dark;
    --edge: color-mix(in oklab, currentColor 14%, transparent);
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    font:
      15px/1.55 ui-sans-serif,
      system-ui,
      -apple-system,
      "Segoe UI",
      sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--edge);
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  header strong {
    font-weight: 600;
  }
  header span {
    opacity: 0.6;
    font-size: 13px;
  }
  #log {
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row {
    display: flex;
  }
  .row.me {
    justify-content: flex-end;
  }
  .bubble {
    max-width: min(68ch, 86%);
    padding: 9px 13px;
    border-radius: 14px;
    border: 1px solid var(--edge);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .me .bubble {
    background: color-mix(in oklab, currentColor 9%, transparent);
  }
  .who {
    font-size: 12px;
    opacity: 0.55;
    margin: 0 0 3px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--edge);
  }
  input {
    flex: 1;
    padding: 10px 13px;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: transparent;
    color: inherit;
    font: inherit;
  }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: color-mix(in oklab, currentColor 10%, transparent);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #note {
    padding: 0 16px 12px;
    color: #b4493c;
    font-size: 13px;
  }
  #note:empty {
    display: none;
  }
</style>

<header>
  <strong>tilde dev</strong>
  <span id="status">connecting…</span>
</header>
<div id="log"></div>
<p id="note"></p>
<form id="composer">
  <input id="text" placeholder="Send a message to your agent…" autocomplete="off" autofocus />
  <button id="send" type="submit">Send</button>
</form>

<script type="module">
  const log = document.getElementById("log");
  const note = document.getElementById("note");
  const status = document.getElementById("status");
  const composer = document.getElementById("composer");
  const text = document.getElementById("text");
  const send = document.getElementById("send");

  // The CLI proxies these to the agent's chat ingress and adds the application key.
  async function rpc(method, body) {
    const response = await fetch(`/rpc/${method}`, {
      method: "POST",
      headers: { "content-type": "application/json", "connect-protocol-version": "1" },
      body: JSON.stringify(body ?? {}),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.message || `${method} failed`);
    return payload;
  }

  let thread;
  let me;
  const seen = new Set();
  const names = new Map();

  function render(message) {
    if (seen.has(message.id)) return;
    seen.add(message.id);
    const mine = message.participantId === me;
    const row = document.createElement("div");
    row.className = `row ${mine ? "me" : "them"}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (!mine) {
      const who = document.createElement("p");
      who.className = "who";
      who.textContent = names.get(message.participantId) ?? "agent";
      bubble.append(who);
    }
    bubble.append(document.createTextNode(message.text ?? ""));
    row.append(bubble);
    log.append(row);
    log.scrollTop = log.scrollHeight;
  }

  async function poll() {
    try {
      const { messages = [] } = await rpc("ListMessages", { threadId: thread, limit: 100 });
      // ListMessages returns newest first; render oldest first.
      for (const message of [...messages].reverse()) render(message);
      note.textContent = "";
    } catch (error) {
      note.textContent = error.message;
    }
  }

  async function start() {
    const { agentId } = await (await fetch("/agent")).json();
    const { user } = await rpc("CreateUser", { name: "dev" });
    const { thread: created } = await rpc("CreateThread", {
      title: "tilde dev",
      primaryAgentId: agentId,
      participants: [{ userId: user.id }, { agentId }],
    });
    thread = created.id;
    for (const participant of created.participants ?? []) {
      if (participant.userId === user.id) me = participant.id;
      else names.set(participant.id, participant.name || "agent");
    }
    status.textContent = "connected";
    send.disabled = false;
    setInterval(poll, 1000);
  }

  composer.addEventListener("submit", async (event) => {
    event.preventDefault();
    const body = text.value.trim();
    if (!body || !thread) return;
    text.value = "";
    send.disabled = true;
    try {
      // Posting is enough: a message from a user with no explicit addressee is addressed to the
      // thread's agent, which is what starts its run. An explicit StartRun would collide with it.
      await rpc("PostMessage", {
        id: crypto.randomUUID(),
        threadId: thread,
        participantId: me,
        text: body,
      });
      await poll();
    } catch (error) {
      note.textContent = error.message;
    } finally {
      send.disabled = false;
      text.focus();
    }
  });

  send.disabled = true;
  start().catch((error) => {
    status.textContent = "not connected";
    note.textContent = `${error.message}. Is the gateway running, and has the agent connected?`;
  });
</script>
