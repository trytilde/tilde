syntax = "proto3";
package tilde.types.v1;
import "google/protobuf/timestamp.proto";

message User { string id = 1; string name = 2; }

message Participant { string id = 1; string name = 2; optional string user_id = 3; optional string agent_id = 4; bool active = 5; }

message ParticipantRef { optional string user_id = 1; optional string agent_id = 2; }

message Thread { string id = 1; string title = 2; string primary_agent_id = 3; repeated Participant participants = 4; ChannelBinding channel = 5; }

message Message { string id = 1; string thread_id = 2; string participant_id = 3; string text = 4; string status = 5; repeated string addressed_participant_ids = 6; optional string in_reply_to_message_id = 7; repeated Attachment attachments = 8; google.protobuf.Timestamp created_at = 9; reserved 10; string format = 11; MessageDelivery delivery = 12; optional string subject = 13; }

message Run { string id = 1; string thread_id = 2; string agent_id = 3; string objective = 4; string status = 5; string invocation_id = 6; string invocation_status = 7; optional string goal_id = 8; }

message Goal { string id = 1; string objective = 2; string status = 3; }

message Task { string id = 1; string title = 2; string status = 3; optional string goal_id = 4; repeated string dependency_ids = 5; string blocked_reason = 6; }

message ToolDefinition {
  string name = 1;
  string provider_id = 2;
  string description = 3;
  string input_schema_json = 4;
  // Empty when this tool does not accept incremental input.
  string chunk_schema_json = 5;
  // Empty when the provider does not describe its result.
  string output_schema_json = 6;
  ToolAnnotations annotations = 7;
  // Short human-readable label shown in place of tool detail; empty falls back to the description.
  string summary = 8;
  // The call returns a ticket at once; its result arrives later as new input to the agent and
  // can be read with `tools.result`.
  bool detached = 9;
  // How its calls appear in end-user chats (the Tilde chat stream); traces keep full detail.
  ToolDisplay display = 10;
}

// How a tool call appears in end-user chats. FULL (and unspecified) shows its input and output,
// SUMMARY only its summary and status, HIDDEN nothing. Admin traces always keep full detail.
enum ToolDisplay { TOOL_DISPLAY_UNSPECIFIED = 0; TOOL_DISPLAY_FULL = 1; TOOL_DISPLAY_SUMMARY = 2; TOOL_DISPLAY_HIDDEN = 3; }

// Hints, not guarantees: frameworks may use them to order, confirm or parallelise calls.
message ToolAnnotations { bool read_only = 1; bool destructive = 2; bool idempotent = 3; bool open_world = 4; }

message Typing { string participant_id = 1; bool typing = 2; google.protobuf.Timestamp expires_at = 3; }

message Attachment { bool persisted = 7; string id = 1; string thread_id = 2; string filename = 3; string media_type = 4; int64 size_bytes = 5; string sha256 = 6; }

message ToolCall {
 string id = 1; string name = 2; string provider_id = 3; string status = 4;
 string input_json = 5 [debug_redact = true]; string output_json = 6 [debug_redact = true];
 string error = 7; string input_delta = 8 [debug_redact = true];
 // Set when the call starts; agent-local reports may supply their own.
 string summary = 9;
 bool detached = 10;
 // Fixed when the call starts, like the summary.
 ToolDisplay display = 11;
}

message ChannelBinding { string connection_id = 1; string provider_id = 2; string external_id = 3; }

message MessageDelivery { string connection_id = 1; string external_message_id = 2; string destination = 3; string status = 4; }

message MessageChunk { string message_id = 1; string text_delta = 2; }

message Activity {
 string event_id = 13; string origin_instance_id = 14; int64 origin_sequence = 15; string origin_agent_id = 16;
 int64 sequence = 1; string kind = 2; string entity_id = 3; string text_delta = 4;
 google.protobuf.Timestamp created_at = 5; string participant_id = 6; string invocation_id = 7;
 oneof detail { Message message = 8; Participant participant = 9; Typing typing = 10; ToolCall tool_call = 11; MessageChunk message_chunk = 12; }
}

message QueuedInput { string id = 1; string invocation_id = 2; string text = 3; string history_through_message_id = 4; }
message QueueState { string agent_id = 1; repeated QueuedInput items = 2; }
