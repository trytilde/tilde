syntax = "proto3";
package tilde.types.v1;
import "google/protobuf/timestamp.proto";

// Resource kinds that carry roles. Deployments, channel access, connections, logs and traces
// follow their agent.
enum ResourceKind { RESOURCE_KIND_UNSPECIFIED = 0; RESOURCE_KIND_AGENT = 1; }
enum PrincipalType { PRINCIPAL_TYPE_UNSPECIFIED = 0; PRINCIPAL_TYPE_USER = 1; PRINCIPAL_TYPE_GROUP = 2; PRINCIPAL_TYPE_API_KEY = 3; }
// An empty id means every resource of the kind, present and future.
message Resource { ResourceKind kind = 1; string id = 2; }
message Principal { PrincipalType type = 1; string id = 2; }
// A named set of actions on resources. Every agent has three system roles, created with it
// and never edited: reader (view), editor (view, edit, share) and deployer (view, deploy,
// share). Installation-wide roles cover every agent and are assigned by administrators only.
message Role { string id = 1; string name = 2; string description = 3; }
// The roles one principal holds that touch a resource.
message RoleAssignment {
  Principal principal = 1;
  // Group name, user email or key name, for display.
  string label = 2;
  repeated Role roles = 3;
  google.protobuf.Timestamp created_at = 4;
}
