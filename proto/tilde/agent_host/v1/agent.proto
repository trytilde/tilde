syntax = "proto3";
package tilde.agent_host.v1;
import "tilde/runtime/v1/cache.proto";
import "tilde/runtime/v1/skills.proto";
import "tilde/types/v1/chat.proto";

// A wake. Tilde never calls an agent host: hosts dial in through tilde.run.v1.RunService.Watch
// and receive this message as a frame (Lambda receives it as the invoke event), then report
// through RunService.Report with the invocation capability.

message InvokeRequest { string deployment_id = 15; string traceparent = 16; string tracestate = 17; string command_id = 12; uint64 assignment_generation = 13; string owner_instance_id = 14; int64 agent_generation = 11; string invocation_id = 1; string run_id = 2; string thread_id = 3; string agent_id = 4; string objective = 5; string callback_url = 6; string capability = 7 [debug_redact = true]; repeated tilde.types.v1.Message messages = 8; tilde.types.v1.Thread thread = 9;  repeated tilde.runtime.v1.CachedAgentRepresentation cached_messages = 10; InvocationState state = 18; }

// What the agent should hold locally for this invocation, pushed with every wake so the SDK
// brings its copy up to date before running instead of asking for it. More of the agent's
// managed state (prompts, configuration) belongs here as it is pushed.
message InvocationState {
  // Every skill the invocation sees at its current version. Registry skills (not `deployed`)
  // are kept in a local folder the SDK updates by version; bundled ones sit beside the code.
  repeated tilde.runtime.v1.SkillSummary skills = 1;
}
