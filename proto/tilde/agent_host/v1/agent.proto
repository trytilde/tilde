syntax = "proto3";
package tilde.agent_host.v1;
import "tilde/runtime/v1/cache.proto";
import "tilde/types/v1/chat.proto";

// Implemented by the deployed agent host; Tilde calls these methods using the agent’s signing key.
// Invoke is a wake: the host may answer on the stream (legacy) or report through
// tilde.run.v1.RunService with its invocation capability. Hosts that dial in receive the
// same InvokeRequest as a RunService.Watch frame instead of an inbound call.

service AgentService {
  rpc Invoke(InvokeRequest) returns (stream InvokeResponse);
  rpc Healthz(HealthzRequest) returns (HealthzResponse);
}

message InvokeRequest { string deployment_id = 15; string traceparent = 16; string tracestate = 17; string command_id = 12; uint64 assignment_generation = 13; string owner_instance_id = 14; int64 agent_generation = 11; string invocation_id = 1; string run_id = 2; string thread_id = 3; string agent_id = 4; string objective = 5; string callback_url = 6; string capability = 7 [debug_redact = true]; repeated tilde.types.v1.Message messages = 8; tilde.types.v1.Thread thread = 9;  repeated tilde.runtime.v1.CachedAgentRepresentation cached_messages = 10; }

message InvokeResponse { string accepted_command_id = 4; string reasoning_delta = 1; bool stopped = 2; repeated string pending_input_ids = 3; }





message HealthzRequest {}

message HealthzResponse { bool ready = 1; }
