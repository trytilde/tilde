syntax = "proto3";
package tilde.management.v1;
import "google/protobuf/timestamp.proto";

// Memory banks hold short facts agents recall and write through the built-in memory tools, and
// people curate here. A bank is shared, or an agent's own (created with the agent's id and
// deleted with it). An agent reaches a bank only through a link, read or read-write. Recall fuses
// full-text search with similarity over embeddings computed through an inference connection
// (the embedding settings); memories not yet embedded are found by full text only.
service MemoryService {
  rpc ListMemoryBanks(ListMemoryBanksRequest) returns (ListMemoryBanksResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetMemoryBank(GetMemoryBankRequest) returns (GetMemoryBankResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // With an agent id, the bank is that agent's own: it is linked read-write and deleted with it.
  rpc CreateMemoryBank(CreateMemoryBankRequest) returns (CreateMemoryBankResponse);
  rpc UpdateMemoryBank(UpdateMemoryBankRequest) returns (UpdateMemoryBankResponse);
  // Deletes the bank and its memories.
  rpc DeleteMemoryBank(DeleteMemoryBankRequest) returns (DeleteMemoryBankResponse);
  rpc ListAgentMemoryBanks(ListAgentMemoryBanksRequest) returns (ListAgentMemoryBanksResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Links a shared bank to the agent, or changes the access of a link. An agent's own bank cannot
  // be linked to another agent.
  rpc SetAgentMemoryBank(SetAgentMemoryBankRequest) returns (SetAgentMemoryBankResponse);
  // Refused for the agent's own bank; delete the bank instead.
  rpc RemoveAgentMemoryBank(RemoveAgentMemoryBankRequest) returns (RemoveAgentMemoryBankResponse);
  // With a query, the bank's memories ranked as agents recall them; without, newest first.
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Every path in the bank holding memories, for its tree.
  rpc ListMemoryPaths(ListMemoryPathsRequest) returns (ListMemoryPathsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // The people a per-person bank keeps memories for.
  rpc ListMemoryPeople(ListMemoryPeopleRequest) returns (ListMemoryPeopleResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // A person's memory (origin OWNER): agents may read it but never change or forget it.
  rpc CreateMemory(CreateMemoryRequest) returns (CreateMemoryResponse);
  // Editing any memory makes it the person's (origin OWNER).
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc GetEmbeddingSettings(GetEmbeddingSettingsRequest) returns (GetEmbeddingSettingsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Embeds a probe text first, so a model that fails or returns another dimension is refused.
  // Every memory is then embedded again under the new settings.
  rpc SetEmbeddingSettings(SetEmbeddingSettingsRequest) returns (SetEmbeddingSettingsResponse);
  // Recall falls back to full text; stored embeddings are kept until settings are set again.
  rpc ClearEmbeddingSettings(ClearEmbeddingSettingsRequest) returns (ClearEmbeddingSettingsResponse);
  // Embedding models of the connection's provider from the price sheet. Any model the provider
  // serves may be set; these are suggestions.
  rpc ListEmbeddingModels(ListEmbeddingModelsRequest) returns (ListEmbeddingModelsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // The bank's synthesis: its chat model, what feeds it and how its worker is doing.
  rpc GetMemorySynthesis(GetMemorySynthesisRequest) returns (GetMemorySynthesisResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Sends the model a probe first, so a model that fails or does not answer in JSON is refused.
  rpc SetMemorySynthesis(SetMemorySynthesisRequest) returns (SetMemorySynthesisResponse);
  // Stops synthesis; what it wrote stays, and setting it again continues where it stopped.
  rpc ClearMemorySynthesis(ClearMemorySynthesisRequest) returns (ClearMemorySynthesisResponse);
  // Whether a read-write linked agent's conversations feed the bank, from their newest message on
  // when turned on (earlier history is not synthesized).
  rpc SetMemoryBankRetain(SetMemoryBankRetainRequest) returns (SetMemoryBankRetainResponse);
  // A wiki whose pages feed the bank.
  rpc SetMemoryBankWiki(SetMemoryBankWikiRequest) returns (SetMemoryBankWikiResponse);
  rpc RemoveMemoryBankWiki(RemoveMemoryBankWikiRequest) returns (RemoveMemoryBankWikiResponse);
  // The bank's latest synthesis batches, newest first.
  rpc ListMemorySynthesisBatches(ListMemorySynthesisBatchesRequest) returns (ListMemorySynthesisBatchesResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Makes the bank due now, after a failure's back-off for example.
  rpc RunMemorySynthesis(RunMemorySynthesisRequest) returns (RunMemorySynthesisResponse);
  // Chat models of the connection's provider from the price sheet; suggestions only.
  rpc ListChatModels(ListChatModelsRequest) returns (ListChatModelsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
}
// SHARED: agents read and write every memory. PER_PERSON: an agent reads and writes only the
// memories of the verified person it acts for, plus memories people wrote for the whole bank.
enum MemoryBankScope { MEMORY_BANK_SCOPE_UNSPECIFIED = 0; MEMORY_BANK_SCOPE_SHARED = 1; MEMORY_BANK_SCOPE_PER_PERSON = 2; }
enum MemoryAccess { MEMORY_ACCESS_UNSPECIFIED = 0; MEMORY_ACCESS_READ = 1; MEMORY_ACCESS_READ_WRITE = 2; }
enum MemoryKind {
  MEMORY_KIND_UNSPECIFIED = 0;
  // Who someone is: role, background, circumstances.
  MEMORY_KIND_PROFILE = 1;
  // How someone likes things done.
  MEMORY_KIND_PREFERENCES = 2;
  // Facts about a thing: a project, company, system or place.
  MEMORY_KIND_ENTITIES = 3;
  // Something that happened, usually with a time.
  MEMORY_KIND_EVENTS = 4;
  // A problem met and how it was resolved.
  MEMORY_KIND_CASES = 5;
  // A convention or approach that works and should be repeated.
  MEMORY_KIND_PATTERNS = 6;
  // How to use a tool or system well.
  MEMORY_KIND_TOOLS = 7;
  // A learned procedure for a recurring task.
  MEMORY_KIND_SKILLS = 8;
}
// How a search found a memory: by its words, or by similarity of meaning.
enum MemoryMatch { MEMORY_MATCH_UNSPECIFIED = 0; MEMORY_MATCH_KEYWORDS = 1; MEMORY_MATCH_MEANING = 2; }
// EXPLICIT: an agent wrote it. OWNER: a person wrote or edited it; agents and synthesis cannot
// change it. SYNTHESIZED: Tilde derived it from the bank's sources; see `evidence`.
enum MemoryOrigin { MEMORY_ORIGIN_UNSPECIFIED = 0; MEMORY_ORIGIN_EXPLICIT = 1; MEMORY_ORIGIN_OWNER = 2; MEMORY_ORIGIN_SYNTHESIZED = 3; }
// Who made a change.
enum MemoryActor { MEMORY_ACTOR_UNSPECIFIED = 0; MEMORY_ACTOR_PERSON = 1; MEMORY_ACTOR_AGENT = 2; MEMORY_ACTOR_SYNTHESIZER = 3; }
message MemoryBank {
  string id = 1; string name = 2; string description = 3; MemoryBankScope scope = 4;
  // Set when the bank is this agent's own.
  optional string agent_id = 5;
  uint32 memory_count = 7;
  // Memories waiting for an embedding under the current settings; 0 without settings.
  uint32 pending_embeddings = 8;
  google.protobuf.Timestamp created_at = 9;
  // Agents linked to it, and how.
  repeated MemoryBankLink links = 10;
  reserved 6;
  reserved "agent_ids";
}
message MemoryBankLink { string agent_id = 1; MemoryAccess access = 2; }
message ListMemoryBanksRequest { optional string search = 1; }
message ListMemoryBanksResponse { repeated MemoryBank banks = 1; }
message GetMemoryBankRequest { string id = 1; }
message GetMemoryBankResponse { MemoryBank bank = 1; }
// Unspecified scope means SHARED.
message CreateMemoryBankRequest { string name = 1; string description = 2; MemoryBankScope scope = 3; optional string agent_id = 4; }
message CreateMemoryBankResponse { MemoryBank bank = 1; }
message UpdateMemoryBankRequest { string id = 1; optional string name = 2; optional string description = 3; }
message UpdateMemoryBankResponse { MemoryBank bank = 1; }
message DeleteMemoryBankRequest { string id = 1; }
message DeleteMemoryBankResponse {}
message AgentMemoryBank { string agent_id = 1; string bank_id = 2; string bank_name = 3; MemoryAccess access = 4; bool own = 5; MemoryBankScope scope = 6; }
message ListAgentMemoryBanksRequest { string agent_id = 1; }
message ListAgentMemoryBanksResponse { repeated AgentMemoryBank banks = 1; }
message SetAgentMemoryBankRequest { string agent_id = 1; string bank_id = 2; MemoryAccess access = 3; }
message SetAgentMemoryBankResponse { AgentMemoryBank bank = 1; }
message RemoveAgentMemoryBankRequest { string agent_id = 1; string bank_id = 2; }
message RemoveAgentMemoryBankResponse {}
message Memory {
  string id = 1; string bank_id = 2; MemoryKind kind = 3;
  // Slash-separated segments, empty for the bank's root.
  string path = 4;
  string title = 5; string content = 6;
  // When it holds: equal for a point in time, the period [from, to), or from `valid_from` on with
  // no `valid_to` (ongoing).
  optional google.protobuf.Timestamp valid_from = 7; optional google.protobuf.Timestamp valid_to = 8;
  float importance = 9; MemoryOrigin origin = 10;
  // The person it belongs to in a per-person bank.
  optional string identity_id = 11;
  optional string written_by_agent_id = 12;
  optional string supersedes_id = 13;
  bool embedded = 14;
  // Where an agent wrote it: the conversation, and the latest message a person sent there.
  optional string thread_id = 15; optional string message_id = 16;
  google.protobuf.Timestamp created_at = 17; google.protobuf.Timestamp updated_at = 18;
  // The memory that replaced this one; a replaced memory is no longer recalled.
  optional string superseded_by = 19;
  // In ListMemories with a query: how it was found.
  repeated MemoryMatch matched = 20;
  // What a synthesized memory was derived from.
  repeated MemoryEvidence evidence = 21;
}
// A message of a conversation (with the conversation's agent), or a wiki page revision (with the
// wiki and path where the page is now, or was when deleted; absent for a wiki the caller cannot
// view).
message MemoryEvidence {
  // A message of a conversation with an agent.
  optional string agent_id = 1; optional string thread_id = 2; optional string message_id = 3;
  // A revision of a wiki page.
  optional string wiki_id = 4; optional string wiki_name = 5; optional string page_id = 6; optional string path = 7;
  optional uint32 revision = 8;
}
enum MemoryOperation {
  MEMORY_OPERATION_UNSPECIFIED = 0; MEMORY_OPERATION_CREATE = 1; MEMORY_OPERATION_UPDATE = 2;
  // Recorded on the memory that was replaced.
  MEMORY_OPERATION_SUPERSEDE = 3;
  MEMORY_OPERATION_FORGET = 4;
}
// The memory as it was after the change.
message MemoryRevision {
  google.protobuf.Timestamp at = 1;
  MemoryOperation operation = 2;
  MemoryKind kind = 3; string path = 4; string title = 5; string content = 6;
  optional google.protobuf.Timestamp valid_from = 7; optional google.protobuf.Timestamp valid_to = 8;
  float importance = 9; MemoryOrigin origin = 10; optional string identity_id = 11;
  // The agent that made it, when an agent did.
  optional string agent_id = 12;
  MemoryActor actor = 13;
}
// `path` limits to that path and below; `limit` defaults to 50, at most 200. Without a query the
// list pages newest first by `page_token`; with one, the best `limit` matches are the only page.
// `identity_id` narrows a per-person bank to one person's memories.
message ListMemoriesRequest {
  string bank_id = 1; optional string query = 2; optional string path = 3; MemoryKind kind = 4; uint32 limit = 5;
  string page_token = 6; MemoryOrigin origin = 7; optional string identity_id = 8;
}
message ListMemoriesResponse { repeated Memory memories = 1; string next_page_token = 2; }
// `count` is of memories exactly at the path.
message MemoryPath { string path = 1; uint32 count = 2; }
message ListMemoryPathsRequest { string bank_id = 1; }
message ListMemoryPathsResponse { repeated MemoryPath paths = 1; }
// A root identity, or a person with none, named after one of its users.
message MemoryPerson { string identity_id = 1; string name = 2; uint32 count = 3; }
message ListMemoryPeopleRequest { string bank_id = 1; }
message ListMemoryPeopleResponse { repeated MemoryPerson people = 1; }
message GetMemoryRequest { string id = 1; }
message GetMemoryResponse { Memory memory = 1; repeated MemoryRevision revisions = 2; }
message CreateMemoryRequest {
  string bank_id = 1; MemoryKind kind = 2; string path = 3; string title = 4; string content = 5;
  optional google.protobuf.Timestamp valid_from = 6; optional google.protobuf.Timestamp valid_to = 7;
  optional float importance = 8;
  // In a per-person bank, the person it belongs to; absent, it holds for everyone.
  optional string identity_id = 9;
  // From `valid_from` with no end yet; not with `valid_to`. Without either, `valid_from` alone is
  // a moment.
  bool ongoing = 10;
}
message CreateMemoryResponse { Memory memory = 1; }
// Absent fields keep their value. `clear_validity` removes the time it holds.
message UpdateMemoryRequest {
  string id = 1; MemoryKind kind = 2; optional string path = 3; optional string title = 4; optional string content = 5;
  optional google.protobuf.Timestamp valid_from = 6; optional google.protobuf.Timestamp valid_to = 7; bool clear_validity = 8;
  optional float importance = 9;
  // With a new `valid_from`: it holds from then with no end yet.
  bool ongoing = 10;
}
message UpdateMemoryResponse { Memory memory = 1; }
message DeleteMemoryRequest { string id = 1; }
message DeleteMemoryResponse {}
message EmbeddingSettings {
  // An inference connection: OpenAI, Azure OpenAI, Vercel AI Gateway, Baseten, Voyage or Cohere.
  string connection_id = 1; string model = 2;
  // 1024 or 1536.
  uint32 dimensions = 3;
}
message GetEmbeddingSettingsRequest {}
// Without settings, memories are recalled by full text only.
message GetEmbeddingSettingsResponse { optional EmbeddingSettings settings = 1; }
message SetEmbeddingSettingsRequest { EmbeddingSettings settings = 1; }
message SetEmbeddingSettingsResponse { EmbeddingSettings settings = 1; }
message ClearEmbeddingSettingsRequest {}
message ClearEmbeddingSettingsResponse {}
message EmbeddingModel {
  string model = 1;
  // Its native dimension when it is 1024 or 1536; 0 when another or unknown (several models take
  // a requested dimension).
  uint32 dimensions = 2;
}
message ListEmbeddingModelsRequest { string connection_id = 1; }
message ListEmbeddingModelsResponse { repeated EmbeddingModel models = 1; }
// A bank's synthesis, on while set. `connection_id` is an OpenAI, Azure OpenAI, Vercel AI
// Gateway, Baseten, Cerebras or Anthropic connection; `instructions` (at most 2000 characters)
// guide the model. Each batch is one call to the model, billed to the connection.
message MemorySynthesis {
  string connection_id = 1; string model = 2; string instructions = 3;
}
message MemoryBankWiki { string wiki_id = 1; string name = 2; }
message GetMemorySynthesisRequest { string bank_id = 1; }
message GetMemorySynthesisResponse {
  // Absent until set.
  optional MemorySynthesis synthesis = 1;
  // Linked agents whose conversations feed the bank, and wikis whose pages do.
  repeated string retaining_agent_ids = 2;
  repeated MemoryBankWiki wikis = 3;
  // Failures since the last batch that succeeded, and the last one's error.
  uint32 failures = 4; string last_error = 5;
  optional google.protobuf.Timestamp last_run_at = 6;
  // Conversations and pages waiting to be synthesized, also while synthesis is off.
  uint32 pending_conversations = 7; uint32 pending_pages = 8;
}
message SetMemorySynthesisRequest { string bank_id = 1; MemorySynthesis synthesis = 2; }
message SetMemorySynthesisResponse { MemorySynthesis synthesis = 1; }
message ClearMemorySynthesisRequest { string bank_id = 1; }
message ClearMemorySynthesisResponse {}
message SetMemoryBankRetainRequest { string bank_id = 1; string agent_id = 2; bool auto_retain = 3; }
message SetMemoryBankRetainResponse {}
message SetMemoryBankWikiRequest { string bank_id = 1; string wiki_id = 2; }
message SetMemoryBankWikiResponse {}
message RemoveMemoryBankWikiRequest { string bank_id = 1; string wiki_id = 2; }
message RemoveMemoryBankWikiResponse {}
// SKIPPED: passed over, with why in its notes: nothing was asked of the model (for example a
// conversation with no verified person in a per-person bank), or its content failed three times
// (an unreadable or cut-off answer, or the provider refusing the content). Other failures (outages,
// credentials, rate limits) leave a batch FAILED and retried; they never pass it over.
enum MemorySynthesisBatchStatus { MEMORY_SYNTHESIS_BATCH_STATUS_UNSPECIFIED = 0; MEMORY_SYNTHESIS_BATCH_STATUS_APPLIED = 1; MEMORY_SYNTHESIS_BATCH_STATUS_FAILED = 2; MEMORY_SYNTHESIS_BATCH_STATUS_SKIPPED = 3; }
// One synthesis of one source's new part: a conversation's messages (with its agent), or a page's
// revision (with the wiki and path where the page is now, or was when deleted; absent for a wiki
// the caller cannot view).
message MemorySynthesisBatch {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  MemorySynthesisBatchStatus status = 3;
  // Where it came from: a conversation with an agent, or a page revision.
  optional string agent_id = 4; optional string thread_id = 5;
  optional string wiki_id = 6; optional string page_id = 7; optional string path = 8; optional uint32 revision = 9;
  uint32 written = 10; uint32 superseded = 11; uint32 forgotten = 12;
  // Operations refused, with why in `notes`; for a failed batch, `notes` is the error.
  uint32 dropped = 13; string notes = 14;
  // The memories it wrote and those it forgot.
  repeated MemorySynthesisBatchMemory memories = 15;
}
message MemorySynthesisBatchMemory { string id = 1; string title = 2; bool forgotten = 3; }
message ListMemorySynthesisBatchesRequest { string bank_id = 1; }
message ListMemorySynthesisBatchesResponse { repeated MemorySynthesisBatch batches = 1; }
message RunMemorySynthesisRequest { string bank_id = 1; }
message RunMemorySynthesisResponse {}
message ListChatModelsRequest { string connection_id = 1; }
message ListChatModelsResponse { repeated string models = 1; }
