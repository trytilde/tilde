syntax = "proto3";
package tilde.management.v1;
import "tilde/types/v1/agent.proto";

service AgentService {
  rpc UploadAgentAvatar(UploadAgentAvatarRequest) returns (UploadAgentAvatarResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc PauseAgent(PauseAgentRequest) returns (PauseAgentResponse);
  rpc ResumeAgent(ResumeAgentRequest) returns (ResumeAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);

}

message CreateAgentRequest {
  // Optional caller-generated UUID. Supply it for retry-safe creation.
  // If omitted, the server generates an ID.
  string id = 1;
  string name = 2;
  reserved 3;
  reserved "description";
  reserved 4, 5;
  reserved "endpoint_url", "webhook_signing_key";
  tilde.types.v1.Capabilities capabilities = 6;
  tilde.types.v1.AgentConcurrencyPolicy concurrency_policy = 7;
}

message CreateAgentResponse { tilde.types.v1.Agent agent = 1; }

message GetAgentRequest { string id = 1; }

message GetAgentResponse { tilde.types.v1.Agent agent = 1; }

message ListAgentsRequest {
  // Case-insensitive name search, or an exact agent UUID.
  string search = 3;
  uint32 page_size = 1;
  string page_token = 2;
}

message ListAgentsResponse {
  repeated tilde.types.v1.Agent agents = 1;
  string next_page_token = 2;
}

message UpdateAgentRequest {
  string id = 1;
  optional string name = 2;
  reserved 3;
  reserved "description";
  reserved 4;
  reserved "endpoint_url";
  // Present empty map clears grants; absence preserves them.
  tilde.types.v1.Capabilities capabilities = 5;
  optional tilde.types.v1.AgentConcurrencyPolicy concurrency_policy = 6;
}

message UpdateAgentResponse { tilde.types.v1.Agent agent = 1; }

message DeleteAgentRequest { string id = 1; }

message DeleteAgentResponse {}

message PauseAgentRequest { string id = 1; }
message PauseAgentResponse {
  tilde.types.v1.Agent agent = 1;
}
message ResumeAgentRequest { string id = 1; }
message ResumeAgentResponse { tilde.types.v1.Agent agent = 1; }

// Management-only image upload. PNG, JPEG, GIF or WebP, at most 5 MiB.
message UploadAgentAvatarRequest {
  string id = 1;
  bytes content = 2;
  string media_type = 3;
}
message UploadAgentAvatarResponse { tilde.types.v1.Agent agent = 1; }
