syntax = "proto3";
package tilde.management.v1;
import "google/protobuf/timestamp.proto";

// Secrets are named values set by people (Connections → Secrets) and referenced by name from
// specs, such as a sandbox blueprint's environment variable (`secret.ref("NPM_TOKEN")` in
// `@trytilde/iac`). Values are write-only: they are sealed when set and never returned.
service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Adds the secret `name`, or replaces its value (when given) and description.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // Refused while a blueprint references it.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message Secret {
  string id = 1;
  // Letters, digits and underscores, not starting with a digit, at most 128.
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Names of the sandbox blueprints whose environment references it that the caller can see.
  repeated string blueprints = 6;
  // How many blueprints reference it, seen or not.
  uint32 blueprint_count = 7;
}
message ListSecretsRequest {
}
message ListSecretsResponse { repeated Secret secrets = 1; }
message SetSecretRequest {
  // Replaces this secret (in its own team) rather than the one named `name`.
  optional string id = 5;
  string name = 1;
  // Required to add a secret; absent keeps an existing secret's value. At most 32 KiB.
  optional string value = 2 [debug_redact = true];
  // At most 500 characters.
  string description = 3;
}
message SetSecretResponse { Secret secret = 1; }
message DeleteSecretRequest { string id = 1; }
message DeleteSecretResponse {}
