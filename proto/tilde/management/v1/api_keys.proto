syntax = "proto3";
package tilde.management.v1;
import "google/protobuf/timestamp.proto";
import "tilde/types/v1/authorization.proto";

// A key holds roles exactly as a user does. It joins no groups, is never an administrator,
// and cannot manage access, users, groups or keys. A creator can give a key only roles they
// could assign themselves. Non-administrators list and revoke only the keys they created.
service ApiKeysService {
 rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
 rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
 rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
}
message ApiKey {
 string id = 1;
 string name = 2;
 string prefix = 3;
 google.protobuf.Timestamp created_at = 4;
 google.protobuf.Timestamp revoked_at = 5;
 optional string created_by_user_id = 6;
 repeated tilde.types.v1.Role roles = 7;
}
message CreateApiKeyRequest {
 string name = 1;
 // Each must be within the creator's reach; installation-wide roles need an administrator.
 // More can be assigned later from an agent's share dialog.
 repeated string role_ids = 2;
}
message CreateApiKeyResponse {
 ApiKey api_key = 1;
 // Returned once. Never included in list responses or stored in plaintext.
 string secret = 2 [debug_redact = true];
}
message ListApiKeysRequest { uint32 page_size = 1; string page_token = 2; }
message ListApiKeysResponse { repeated ApiKey api_keys = 1; string next_page_token = 2; }
message RevokeApiKeyRequest { string id = 1; }
message RevokeApiKeyResponse {}
