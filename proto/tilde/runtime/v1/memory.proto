syntax = "proto3";
package tilde.runtime.v1;
import "tilde/types/v1/chat.proto";

// The memory tools of an agent whose conversations a sidecar runs. Memory lives in the gateway's
// Postgres, so the sidecar relays its agent's memory tool listing and calls here (through the
// registry relay, which re-verifies the invocation token) rather than answering them itself.
// Agents call the tools through ChatService as everywhere else.
service MemoryService {
  rpc ListMemoryTools(ListMemoryToolsRequest) returns (ListMemoryToolsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc InvokeMemoryTool(InvokeMemoryToolRequest) returns (InvokeMemoryToolResponse);
}
message ListMemoryToolsRequest {}
message ListMemoryToolsResponse { repeated tilde.types.v1.ToolDefinition tools = 1; }
// `call_id` is the tool call's, so a retried call writes once.
message InvokeMemoryToolRequest { string name = 1; string input_json = 2; string call_id = 3; }
message InvokeMemoryToolResponse { string output_json = 1; }
