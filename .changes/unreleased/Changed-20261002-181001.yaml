kind: Changed
body: "The quickstart now runs with no setup at all: `docker compose up -d --wait` generates the encryption key on first start, keeps it in a Docker volume and reuses it on restart, so there is no .env to create (set TILDE_ENCRYPTION_KEY to supply your own). It also health-checks the gateway against /readyz, so `up --wait` returns only once it can serve instead of racing the next command, and quickstart/.env is gitignored in case you make one."
