kind: Added
body: "Built-in skill and wiki-link tools: `skills.write` (create or replace a skill in an editor skill source, offered with `skills.edit`), `skills.assign` and `skills.unassign` (give or take a skill source or one skill, offered with `agents.edit_skills`; assigning also needs `skills.read` on the source) and `wiki.link` / `wiki.unlink` (give another agent a wiki the calling agent is linked to, read or read-write up to its own access, or take it away), offered with the new capability `agents.edit_wikis`, which the agent editor, `tilde.types.v1.Capabilities` and declarative apply (`capabilities` in `@trytilde/iac`) carry. Each authorizes like the runtime or management call it mirrors. `agents.list` now returns each agent's `key`."
time: 2026-11-26T12:00:00+00:00
