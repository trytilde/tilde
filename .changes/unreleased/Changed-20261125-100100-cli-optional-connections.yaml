kind: Changed
body: "`tilde deploy` (Tilde Cloud ontologies): a connection the ontology declares optional (`{ provider, optional: true }` in its `connections`) no longer has to be bound or in the spec; the deploy reports it as skipped and rolls out without it. `--check` on an ontology whose project does not exist yet is refused: Tilde compiles an ontology for its project, which the first deploy creates."
time: 2026-11-25T10:01:00+00:00
