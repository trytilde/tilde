kind: Added
body: "Add wikis: trees of Markdown reference pages that agents read and edit through built-in wiki tools (search, grep, read, list, write, delete), with every change kept as a revision and concurrent edits refused rather than overwritten. A Wikis sidebar page lists them with each wiki's page tree, editor, history and search, and an agent's Capabilities can give it a wiki of its own and shared wikis."
