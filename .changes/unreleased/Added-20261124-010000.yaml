kind: Added
body: "A project's root `tilde deploy` releases every agent that declares `deploy`, after its ontologies and their bindings. Each agent's code is in `agents/<key>/`, or wherever `defineAgent({ code })` names (an entry module, or a folder with its own package.json or pyproject.toml); `tilde deploy` reads each one's prompts, skills and tools there and registers a deployment with an external ID of its own. An agent with neither has its code in another repository: its spec is applied, it is not released, and a note says so. From an agent's own folder, the one deploying agent without code of its own releases the entry's declarations, so `tilde deploy` there works as before. A deploy with several deploying agents prints each new dial-in token as a `<key> <token>` line; with one, the token alone. `--check` no longer reads the agents' code. An agent folder may hold its own `tilde.config.ts`: its release, like `tilde dev`, reads the package's code entry (`main`, `dist/index.js`, ...), never the config."
