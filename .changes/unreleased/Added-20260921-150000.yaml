kind: Added
body: >-
  Authorize management access with roles. A role is a named set of actions on agents; every
  agent is created with three system roles, reader (view), editor (view, edit, share) and
  deployer (view, deploy, share), and users, groups and API keys hold any number of them.
  Sharing stays within reach: assigning a role needs share on the agent and every action the
  role gives, so editors hand out reader and editor, deployers reader and deployer, and
  administrators anything. Agents are shared from a people icon in their header, which
  searches users and groups, offers each role with what it allows, and can open the agent to
  every signed-in user. Installation-wide reader, editor and deployer roles over every agent,
  including ones created later, are assigned by administrators, to people or to API keys at
  creation. The API key page chooses reader or editor on all or selected agents and whether
  the key manages deployments. The sidebar groups API keys and groups under IAM. Without a role
  an agent is not found. Deployments, channel access, budgets, sessions, logs and traces
  follow their agent; connections and identities carry no roles. Groups are administrators,
  all users, external groups mirrored from the OIDC group claim at login, and locally managed
  groups. Any signed-in user may create agents and is their editor and deployer. API keys no
  longer have full authority, join no groups and never manage access; agent capability edits
  are bounded by the editor's own access; every management RPC applies its own rule and a test
  covers all of them. This governs the control plane only: the agent runtime listener,
  including trace, log and metric upload, still takes only the agent's invocation token and
  capabilities. Existing users remain administrators, existing keys hold nothing until given a
  role, and the first user of a new installation becomes an administrator. Configure
  ENGINE_OIDC_GROUPS_CLAIM, ENGINE_OIDC_SCOPES, ENGINE_OIDC_ADMIN_GROUPS and
  ENGINE_OIDC_ADMIN_SUBJECTS.
