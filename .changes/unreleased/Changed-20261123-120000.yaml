kind: Changed
body: "`tilde deploy` builds a project's ontologies on the client and uploads artifacts: each ontology's IR, evaluated with the project's own `@trytilde/ontology` (install it beside each ontology, and `@trytilde/spaces` in its spaces) and checked by Tilde Cloud (`CompileOntology`, whose errors fail the deploy before anything changes), its handler module and its spaces, built against the contract Tilde compiles. It needs Node 22 or newer and a Tilde Cloud with client builds; Tilde Cloud no longer builds sources."
