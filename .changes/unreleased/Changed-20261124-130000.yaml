body: "Ontology slots are connections: `defineProject({ ontologies: { <name>: ontology({ environments: { <env>: { connections, secrets } } }) } })` replaces `slots`, `ontology<typeof connections>()` types the bindings by the ontology's own `connections`, and `tilde deploy`'s plan says `connection <name>`. Needs Tilde Cloud with the rename (it sends and reads only `name`/`connections`), and `slots` is no longer read."
