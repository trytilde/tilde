kind: Added
body: "Ten more built-in connection providers for the software factory, each with tools for agents: GitLab (access token on gitlab.com or a self-managed URL, or an OAuth app), Jira Cloud (API token or OAuth 2.0 3LO), Entire (service account secret and cluster host), Datadog, Grafana, Prometheus, PagerDuty (API key or OAuth), New Relic, Honeycomb and Terraform (HCP Terraform or Terraform Enterprise). GitLab and Entire are git forges with sandbox egress like GitHub: a blueprint's grant narrows to projects or repositories and push branches (default `factory/*`), sandboxes clone and push through the gateway (`entire://` remotes included, with no remote helper), and the credential never enters the VM. Atlassian, GitLab, Datadog, New Relic and Honeycomb's hosted MCP servers join the same providers as `mcp_oauth` types. `@trytilde/iac` has typed refs for all ten (`gitlab.ref(...).tools(...)`)."
