kind: Changed
body: 'A connection in use can no longer be disconnected: `ConnectionsService.Disconnect` (and deleting a tool host whose instances are in use) refuses with `failed_precondition` naming every use (agent assignments, personal allowances, tool sources, routines, sandbox blueprints and egress grants, sandboxes left on an old connection, memory embeddings and synthesis), and `Connection.usages` lists them on GetConnection and ListConnections, shown as "In use by" in the console where the Disconnect action is now blocked. A disconnected connection cannot be assigned, used as a tool source or by a routine until it is reconnected, and foreign keys from those uses now restrict deletes instead of silently unbinding them. Deleting an agent also removes its tool sources, routines (with their run history) and personal allowances.'
time: 2026-11-25T22:00:00+00:00
