kind: Added
body: '`tilde iac types` writes a `.d.ts` from the organization''s own connections (MCP servers and tool hosts'' instances): it augments `@trytilde/iac`''s new `Connections` interface, so `connection.ref("acme_mcp/prod")` takes that connection''s type and tool names and a typo does not compile. Slugs it does not list, and `untypedTools`, still take plain strings.'
