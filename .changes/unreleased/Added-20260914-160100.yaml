kind: Added
body: Wake-and-dial run protocol. Long-running hosts dial the gateway with their deployment token and receive wakes as frames, Lambda deployments are woken through the AWS invoke API, and every host reports acceptance, reasoning and completion through RunService with its invocation capability; the SDK gains connectAgent and createLambdaHandler.
