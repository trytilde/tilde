kind: Added
body: "Runs outlive their invocations: a tool call of a caller that can suspend (the SDKs' framework adapters) that is still running after a minute (`TILDE_TOOL_PENDING_AFTER_MS`), or at the invocation's deadline, answers pending and goes on in the background; the adapter saves its conversation with `ChatService.SuspendRun` and the invocation ends; once the pending calls finish Tilde starts the same run's next invocation (`InvokeRequest.resumes`), which reads the state and the outcomes with `GetCheckpoint`. Tilde owns the runtime limit: a Lambda invocation is asked to suspend two minutes before Lambda's fifteen (the control stream's suspend command, which now leaves the stream open until the invocation ends). The built-in `thread.wait_for_reply` (thread.read) waits for a person the same way: its output is the next message routed to the agent, which then starts no run of its own."
