kind: Added
body: "Routines: an agent's Routines tab creates prompts that run the agent on a five-field UTC cron schedule or when a connection emits a signal, each firing in a new thread whose title and prompt are templates over the signal's variables. Connections gain a `signal` capability, ported from the trytilde/api signal providers: GitHub App, Slack, AgentMail, Linq, WhatsApp (Meta and Telnyx), Sentry and Firecrawl connections emit signals."
time: 2026-10-03T12:00:00+02:00
