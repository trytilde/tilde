kind: Added
body: "Every framework adapter suspends and resumes its loop with no change to agent code: the Vercel AI SDK (`prepareTildeCall`), Mastra (`tildeMastra`), LangChain (`tildeMiddleware`) and OpenAI Agents (`tildeOpenAIAgents`) in TypeScript, and LangChain, OpenAI Agents and Pydantic AI in Python, save the conversation in their framework's message format before the next model call when a Tilde tool call answers pending or Tilde's deadline comes, and continue from it with the call's outcome in the run's next invocation. The contract is on `AgentContext` (`enableSuspension`/`enable_suspension`, `shouldSuspend`, `suspend`, `resumed`). Agno and CrewAI cannot replace their loop's messages at a step boundary and keep blocking calls."
