kind: Changed
body: "Long calls survive proxies with idle timeouts (an AWS load balancer cuts a connection silent for 60 s). `ChatService.InvokeToolStream` and `SandboxService.InvokeToolStream` stream a heartbeat every 10 s while a tool runs, then the result (`tilde sandbox call` uses it, falling back to `InvokeTool`); sidecars relay over `SidecarService.RelayStream`, bounded by 45 s of silence instead of 15 s in all; `WatchThread` sends a keepalive frame (no activity, same cursor); a non-streamed inference call silent for 20 s is answered 200 with JSON whitespace until the provider's body. Management RPCs waiting on outside work fail after 45 s with their own error, or finish skill source syncs in the background. `InvokeTool` and `Relay` remain for older SDKs and sidecars."
