kind: Added
body: "`@trytilde/iac`: `defineProject({ ontologies: { <name>: ontology({ environments: { <env>: { slots, secrets } } }) } })` declares a project's ontologies (Tilde Cloud, each in the repository's `ontologies/<name>/`) and each environment's connection slot and secret bindings; `ontology<typeof slots>()` types a slot's binding by its provider (`ConnectionRef` now carries `provider`). `tilde deploy` deploys them before the agents, changing nothing until everything is checked (the ontologies' preflight and the agents' dry-run Apply, every missing project, environment, connection and secret with a link): then a version per ontology from the repository at HEAD, checked against the spec, and each environment bound and rolled out in turn (`--only ontologies|agents`, `--ontology <name>`, `--allow-dirty`, `--accept-rebuild <model>`). A server without ontologies answers that they need Tilde Cloud."
time: 2026-11-21T18:00:00+00:00
