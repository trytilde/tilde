kind: Added
body: "Sandbox egress reaches the API providers agents read from sandboxes, with the connection's credential added at the gateway: Linear (GraphQL queries and the granted mutations), Sentry (reads and issue updates, narrowed to organizations), Jira (API token connections), PagerDuty, Datadog, Grafana, Prometheus, New Relic, Honeycomb, HCP Terraform, and AWS, whose requests the gateway signs with SigV4 for the service and region the sandbox's SDK signed for, limited to the grant's services, regions and reads. Each provider's standard client is wired to the route (`LINEAR_API_URL`, `SENTRY_URL`, `AWS_ENDPOINT_URL` with the egress token as the access key ID, `DD_API_KEY`, `GRAFANA_URL`, `HONEYCOMB_API_ENDPOINT`...), every grant also sets `TILDE_EGRESS_<SLUG>_TOKEN`, and the route takes the token wherever those clients send their key."
