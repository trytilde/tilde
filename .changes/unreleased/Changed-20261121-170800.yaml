kind: Changed
body: "Connections mint the credentials consumers send upstream through one service: a stored credential as it is, or GitHub App installation tokens and AWS STS sessions, cached until shortly before they expire. Health probes are no longer traced, unmatched routes are traced only on a 5xx, and ENGINE_CLICKHOUSE_CA_CERT pins a self-hosted ClickHouse's CA."
