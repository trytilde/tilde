kind: Added
body: "`tilde local`: connect a harness on your machine to a local agent, an agent Tilde lists and equips but never runs. `tilde local install claude-code|codex|claude-desktop --url <gateway> --agent-id <id>` stores the agent's key in `~/.tilde/local`, adds the harness's hooks and registers `tilde local mcp` as its MCP server, so the agent's tools reach the harness without the key entering its configuration. The hooks report each Claude Code and Codex session to Tilde as a thread (prompts, answers and finished tool calls, sent once and resumed from a cursor) and keep the agent's skills in the harness's own skill folder; `tilde local uninstall` removes all of it. Contracts: `Agent.local` (harness and the features its adapter supports), `CreateAgentRequest.harness` and `tilde.local.v1.LocalAgentService`."
